[package]
name = "teachsort"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Teach a local filename classifier, review a plan, organize files, and undo."
license = "MIT"
repository = "https://github.com/cjw0076/teachsort"
readme = "README.md"
keywords = ["files", "organizer", "cli", "local-first", "automation"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
